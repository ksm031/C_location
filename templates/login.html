<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: #fff; padding: 32px 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 320px; display: flex; flex-direction: column; gap: 20px; }
    h1 { font-size: 20px; color: #1e1e2e; text-align: center; }
    .fields { display: flex; flex-direction: column; gap: 12px; }
    input[type="password"] { padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; width: 100%; }
    input[type="password"]:focus { outline: none; border-color: #4c6ef5; box-shadow: 0 0 0 3px rgba(76,110,245,0.15); }
    button { padding: 10px; background: #4c6ef5; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; width: 100%; }
    button:hover { opacity: 0.85; }
    .error { color: #dc2626; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <h1>텍스트 저장소</h1>
  <form method="POST" class="fields">
    <input type="password" name="password" placeholder="비밀번호" autofocus>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit">로그인</button>
  </form>
</div>
</body>
</html>
